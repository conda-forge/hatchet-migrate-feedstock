context:
  version: "0.120.30"

package:
  name: hatchet-migrate
  version: ${{ version }}

source:
  - url: https://github.com/hatchet-dev/hatchet/archive/refs/tags/v${{ version }}.tar.gz
    sha256: 5233e0488254e4fe0b3591748cb7862eeca6ade2b6096456f3c45ea32722f629
    target_directory: src
  - url: https://raw.githubusercontent.com/mattn/go-localereader/6bae6c923850ab5e0da9f36f69811ffe17064228/LICENSE
    sha256: dceede03550621e65ec7b79fcba87cf6dbb9d31132a8ae71a8fe8ceec0af7da3
    file_name: LICENSE-go-localereader

build:
  number: 0
  script:
    - cd src/cmd/hatchet-migrate
    - go-licenses save . --save_path ../../../library_licenses --ignore github.com/mattn/go-localereader
    - if: unix
      then: go build -v -o $PREFIX/bin/hatchet-migrate -ldflags="-s -w"
      else: go build -v -o %LIBRARY_BIN%\hatchet-migrate.exe -ldflags="-s -w"

requirements:
  build:
    - ${{ compiler("go-nocgo") }}
    - go-licenses

tests:
  - script:
      - hatchet-migrate --help
      - hatchet-migrate --version
  - package_contents:
      bin:
        - hatchet-migrate
      strict: true

about:
  homepage: https://hatchet.run
  summary: Hatchet Migrate - database migration tool for Hatchet workflow orchestration
  description: |
    Hatchet is an orchestration engine for background tasks, AI agents, and
    durable workflows. This package provides the hatchet-migrate CLI for
    running database migrations for Hatchet.
  license: MIT
  license_file:
    - src/LICENSE
    - library_licenses/
    - LICENSE-go-localereader
  documentation: https://docs.hatchet.run
  repository: https://github.com/hatchet-dev/hatchet

extra:
  recipe-maintainers:
    - xhochy
